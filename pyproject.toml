[project]
name = "agent-migration"
version = "0.1.0"
description = "MABC 2026 — Agent Upgrade Auditor & Policy Testbed"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
auditor = [
    "typer",
    "jinja2",
    "openai",
    "python-dotenv",
]
testbed = [
    # 팀원이 채웁니다 (langgraph, langchain-core 등)
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
