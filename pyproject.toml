[project]
name = "agent-migration"
version = "0.1.0"
description = "MABC 2026 — Agent Upgrade Auditor & Policy Testbed"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    # Windows에는 IANA 타임존 DB가 없어 zoneinfo가 "Asia/Seoul"을 못 찾는다.
    # policies/policy_oracle.py가 import 시점에 ZoneInfo를 부르므로 없으면 수집 단계에서 죽는다.
    # Linux/macOS는 시스템 DB를 먼저 쓰므로 이 패키지는 폴백으로만 동작한다.
    "tzdata",
]

[project.optional-dependencies]
auditor = [
    "typer",
    "jinja2",
    "openai",
    "python-dotenv",
]
testbed = [
    # 팀원이 채웁니다 (langgraph, langchain-core 등)
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"apps/cli.py" = ["B008"]  # Typer's documented declarative Option defaults

[tool.pytest.ini_options]
pythonpath = ["."]
